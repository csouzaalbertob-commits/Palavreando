{% extends "base/basepg.html" %}
{% load static %}

{% block title %}Cadastrar Aluno — Palavreando{% endblock title %}

    {% block main %}
    <style>
    /* Container de preview restrito */
    .preview-foto-container {
        width: 100%;
        max-width: 260px;
        height: 260px;
        margin: 0 auto 1rem auto;
        border: 2px dashed #0d6efd;
        border-radius: 1rem;
        overflow: hidden;
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* Garante que a imagem se ajuste perfeitamente sem estourar */
    .preview-foto-container img, 
    .preview-foto-container video {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Recorta a imagem proporcionalmente mantendo o enquadramento */
        display: block;
    }
    </style>
    <div class="container" style="max-width: 900px;">
        <!-- Cabeçalho -->
        <header class="bg-primary text-white py-3 shadow-sm mb-4">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                            <img src="{% static 'img/logo.png' %}" alt="Logo" width="200" height="auto" class="d-inline-block align-text-top me-2" style="object-fit: contain;">
                        </a>
                    <h2 class="h4 mb-0 fw-bold fonte-garrafal text-white">Cadastro de Estudante</h2>
                </div>
                <a href="{% url 'autentica:dashboard' %}" class="btn btn-light text-primary fw-bold rounded-pill">
                    <i class="bi bi-arrow-left-circle-fill me-1"></i> Voltar ao Dashboard
                </a>
            </div>
        </header>

        <!-- Card Principal -->
        <div class="card card-custom p-4 bg-white">
            <form method="post" enctype="multipart/form-data" id="formAluno">
                {% csrf_token %}
                
                <!-- Campo Oculto para foto da Webcam -->
                <input type="hidden" name="foto_webcam" id="fotoWebcam">

                <div class="row g-4">
                    <!-- Coluna da Esquerda: Câmera / Upload da Foto -->
                    <div class="col-md-5 text-center border-end pe-md-4">
                        <label class="form-label fw-bold text-secondary d-block">Foto do Aluno</label>
                        
                        <!-- Pré-visualização da Imagem -->
                        <div class="mb-3">
                            <div class="preview-foto-container">
                                <img id="imgPreview" src="https://via.placeholder.com/140?text=Sem+Foto" class="preview-box shadow-sm" alt="Foto">
                                <video id="webcamVideo" class="preview-box shadow-sm d-none" autoplay playsinline></video>
                            </div>
                        </div>

                        <!-- Opções de Captura -->
                        <div class="d-flex justify-content-center gap-2 mb-3">
                            <button type="button" class="btn btn-outline-primary btn-sm fw-semibold" id="btnWebcam" onclick="startWebcam()">
                                <i class="bi bi-camera-fill me-1"></i> Usar Câmera
                            </button>
                            <button type="button" class="btn btn-success btn-sm fw-semibold d-none" id="btnSnap" onclick="takeSnapshot()">
                                <i class="bi bi-circle-fill me-1"></i> Fotografar
                            </button>
                        </div>

                        <div class="text-muted small mb-2">— OU —</div>

                        <!-- Upload do Arquivo -->
                        <input type="file" name="foto" id="id_foto" class="form-control form-control-sm" accept="image/*" onchange="previewFile(this)">
                    </div>

                    <!-- Coluna da Direita: Dados do Formulário -->
                    <div class="col-md-7 ps-md-4 d-flex flex-column justify-content-between">
                        <div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">Nome Completo</label>
                                <input type="text" name="nome_completo" class="form-control" placeholder="Digite o nome do aluno..." required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold text-dark">Turma</label>
                                    <input type="text" name="turma" class="form-control" placeholder="Ex: 201" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold text-dark">Série / Ano</label>
                                    <input type="text" name="serie" class="form-control" placeholder="Ex: 2º Ano">
                                </div>
                            </div>
                        </div>

                        <!-- Botão de Ação (Estilo Idêntico ao da imagem) -->
                        <div class="pt-3 border-top text-end">
                            <button type="submit" class="btn btn-success btn-lg px-4 fw-bold">
                                <i class="bi bi-card-heading me-1"></i> Gerar Carteirinha
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    {% endblock main %}
    
    {% block script %}
    <!-- Script para controle da WebCam e pré-visualização -->
    <script>
        let videoStream = null;
        const video = document.getElementById('webcamVideo');
        const preview = document.getElementById('imgPreview');
        const btnWebcam = document.getElementById('btnWebcam');
        const btnSnap = document.getElementById('btnSnap');
        const inputWebcam = document.getElementById('fotoWebcam');

        async function startWebcam() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = videoStream;
                video.classList.remove('d-none');
                preview.classList.add('d-none');
                
                btnWebcam.classList.add('d-none');
                btnSnap.classList.remove('d-none');
            } catch (err) {
                alert("Não foi possível acessar a câmera.");
            }
        }

        function takeSnapshot() {
            const canvas = document.createElement('canvas');
            canvas.width = 300;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 300, 300);

            const dataUrl = canvas.toDataURL('image/png');
            inputWebcam.value = dataUrl;
            preview.src = dataUrl;

            // Para a transmissão da câmera
            videoStream.getTracks().forEach(track => track.stop());
            video.classList.add('d-none');
            preview.classList.remove('d-none');

            btnSnap.classList.add('d-none');
            btnWebcam.classList.remove('d-none');
            btnWebcam.innerHTML = `<i class="bi bi-camera-fill me-1"></i> Tirar Outra`;
        }

        function previewArquivo(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();

        reader.onload = function(e) {
            const imgPreview = document.getElementById('img-preview');
            const videoWebcam = document.getElementById('webcam-video');

            // Oculta vídeo se estivesse aberto
            if (videoWebcam) videoWebcam.classList.add('d-none');

            // Exibe a imagem de preview ajustada no container
            imgPreview.src = e.target.result;
            imgPreview.classList.remove('d-none');
            
            // Limpa o valor base64 da webcam para não sobrepor o arquivo enviado
            document.getElementById('input-foto-webcam').value = '';
        };

        reader.readAsDataURL(input.files[0]);
    }
}
    </script>
    {% endblock %}
