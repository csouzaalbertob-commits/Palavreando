{% extends "base/basepg.html" %}
{% load static %}

{% block main%}
    <div class="cartao">
        <h2>Avaliação de Fluência</h2>
        <p><strong>Aluno:</strong> {{ aluno_nome }}</p>
        <p><small>Professora: {{ prof_nome }}</small></p>

        <!-- A tag src chama diretamente a view que desenha o QR Code -->
        <img class="qr-code" src="{% url 'gerar_qrcode_aluno' aluno_id=aluno_id prof_id=prof_id %}" alt="QR Code de Acesso">

        <p><small>Aproxime da câmera do Chromebook para iniciar</small></p>
        <button class="btn-imprimir" onclick="window.print()">Imprimir Cartão</button>
    </div>
    {% endblock main %}
