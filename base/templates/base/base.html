{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PALAVREANDO - Sistema de Leitura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}?v=1" type="image/x-icon">
    <link rel="icon" href="{% static 'img/favicon.png' %}?v=1" type="image/png">
    <style>
        .hero-banner {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            border-radius: 20px;
        }
        .action-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            border-radius: 16px;
        }
        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12) !important;
        }
        .card-icon {
            font-size: 3rem;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-between py-4">
<main>
</main>
{% block main %}
{% endblock main %}
<footer>
    <div class="container text-center text-muted small my-4">
        <p class="mb-0">© 2026 Sistema de Leitura Interativa por Voz — CISEBAM.</p>
        <p class="mb-0">Desenvolvido por <a href="https://www.linkedin.com/in/carlos-alberto-brito-de-souza-873a58384/" target="_blank" class="text-decoration-none">Carlos Brito</a> e <a href="https://www.linkedin.com/in/alessandra-jastes-33b28169/" target="_blank" class="text-decoration-none">Alessandra Jastes</a>.</p>
        <p class="mb-0">Todos os direitos reservados.</p>

        <div class="mb-0 app-version">
            v{{ APP_VERSION }}
        </div>
    </div>
</footer>
</body>
</html>
