{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %}</title>

    <!-- Google Fonts: Montserrat (Sem Serifa, Garrafal e de Alta Legibilidade) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <link rel="icon" href="{% static 'img/favicon.png' %}" type="image/png">
    <!-- Leitor de QR Code JS -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Chart.js script de graficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Define a fonte padrão de toda a aplicação */
        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Classe utilitária para fontes garrafais universais */
        .fonte-garrafal {
            font-family: 'Montserrat', sans-serif !important;
            text-transform: uppercase !important;
            font-weight: 900 !important;
            letter-spacing: 3px;
        }

        /* Variações de tamanhos para textos garrafais de alunos */
        .garrafal-sm { font-size: 1.8rem; }
        .garrafal-md { font-size: 2.8rem; }
        .garrafal-lg { font-size: 4.5rem; }

        /* Container padrão para exibição de palavras aos alunos */
        .box-palavra-garrafal {
            font-family: 'Montserrat', sans-serif !important;
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #0d6efd;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 4px dashed #0d6efd;
            border-radius: 1.25rem;
            user-select: none;
            word-break: break-word;
        }

        {% block style %}{% endblock style %}
    </style>
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-between">

    <main>
        {% block main %}
        {% endblock main %}
    </main>

    <footer class="py-3 bg-white border-top mt-auto">
        <div class="container text-center text-muted small">
            <p class="mb-1">© 2026 Sistema de Leitura Interativa por Voz</p>
            <p class="mb-1">Desenvolvido por <a href="https://www.linkedin.com/in/carlos-alberto-brito-de-souza-873a58384/" target="_blank" class="text-decoration-none">Carlos Brito</a> e <a href="https://www.linkedin.com/in/alessandra-jastes-33b28169/" target="_blank" class="text-decoration-none">Alessandra Jastes</a>.</p>
            <p class="mb-0">Todos os direitos reservados.</p>
            <div class="mb-0 app-version">
                v{{ APP_VERSION }}
            </div>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block script %}{% endblock script %}
</body>
</html>
